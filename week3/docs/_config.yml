# GitHub Pages Configuration for Recall Documentation

# Theme
theme: jekyll-theme-minimal

# Site metadata
title: Recall
description: Consent Management Dashboard - Privacy-First Data Withdrawal
url: https://your-username.github.io/recall

# Author
author:
  name: Maneetta Antony
  email: matvxhmt@gmail.com
  github: your-github-username

# GitHub Pages
github:
  repository_nwo: your-username/recall
  pages_health_check_disabled: false

# Plugins
plugins:
  - jekyll-github-metadata
  - jekyll-sitemap
  - jekyll-seo-tag

# SEO
google_site_verification: ""
twitter:
  username: "@your-twitter"

# Navigation
navigation:
  - Home: "/"
  - Getting Started: "/getting-started"
  - Architecture: "/architecture"
  - Configuration: "/configuration"
  - API Reference: "/api"
  - Troubleshooting: "/troubleshooting"
  - Contributing: "/contributing"

# Markdown processor
markdown: kramdown
kramdown:
  syntax_highlighter: rouge
  toc_levels: 2..3

# Exclude from processing
exclude:
  - .gitignore
  - README.md
  - Makefile
  - .env
  - .runtime
  - __pycache__
  - "*.egg-info"
